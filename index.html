<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mershessenger</title>
<style>
:root {
    --bg: #0a0a0f; --panel: rgba(25, 25, 35, 0.8); --text: #fff; --muted: #8a8a95;
    --accent: #7c3aed; --gradient: linear-gradient(135deg, #a855f7, #6d28d9);
    --msg-in: rgba(40, 40, 55, 0.9); --msg-out: linear-gradient(135deg, #7c3aed, #4c1d95);
    --border: rgba(255,255,255,0.1);
}
body.light-theme {
    --bg: #f0f2f5; --panel: rgba(255, 255, 255, 0.8); --text: #000; --muted: #666;
    --accent: #7c3aed; --gradient: linear-gradient(135deg, #a855f7, #6d28d9);
    --msg-in: #e0e0e0; --msg-out: linear-gradient(135deg, #a855f7, #6d28d9); --border: rgba(0,0,0,0.05);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);transition:0.3s;}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow-y:auto;z-index:1;background:transparent}
.screen.active{display:flex; animation: fadeIn 0.4s ease-out;}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
#screenAuth{align-items:center;justify-content:center;padding:20px}
.auth-box{width:100%;max-width:380px;background:var(--panel);backdrop-filter:blur(20px);border-radius:24px;padding:30px;border:1px solid var(--border);}
.logo{text-align:center;font-size:2.5rem;font-weight:900;margin-bottom:20px;background:var(--gradient);-webkit-background-clip:text;color:transparent;}
input{width:100%;padding:15px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,0.2);color:var(--text);font-size:1rem;margin-bottom:10px;outline:none;}
body.light-theme input { background: rgba(255,255,255,0.5); }
button{width:100%;padding:15px;border-radius:12px;border:none;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:10px;color:#fff;transition:0.2s;}
.btn-main{background:var(--gradient); box-shadow: 0 4px 15px rgba(124,58,237,0.4);}
.btn-sec{background:transparent;border:1px solid var(--accent);color:var(--text)}
.hidden{display:none!important}
#screenMain{padding-bottom:70px}
.top-bar{padding:15px;background:var(--panel);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;font-weight:900;font-size:1.2rem;text-align:center;color:var(--accent);}
.content{flex:1;padding:15px;overflow-y:auto;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:var(--panel);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:50;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;border:none;color:var(--muted);font-size:.7rem;gap:4px;cursor:pointer;}
.nav-item.active{color:var(--accent);}
.nav-icon{font-size:1.5rem; transition:0.3s;}
.nav-item.active .nav-icon{transform:translateY(-3px) scale(1.1); filter:drop-shadow(0 0 8px var(--accent));}
.chat-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border-radius:14px;margin-bottom:8px;cursor:pointer;border:1px solid var(--border);}
.chat-av{width:48px;height:48px;border-radius:50%;background:var(--msg-out);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;overflow:hidden;color:#fff;flex-shrink:0;position:relative}
.chat-av img {width:100%;height:100%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-name{font-weight:600;display:flex;align-items:center;gap:5px;}
.chat-last{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge-verified { color: #3b82f6; font-size: 1.1rem; filter: drop-shadow(0 0 5px #3b82f6);}
.badge-admin { color: #eab308; font-size: 1.1rem; filter: drop-shadow(0 0 5px #eab308);}
.chat-view{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:60;}
.chat-view.active{display:flex;animation:slideIn 0.3s ease-out;}
@keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
.chat-head{padding:15px;background:var(--panel);backdrop-filter:blur(15px);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.back-btn{background:none;border:none;color:var(--text);font-size:1.5rem;width:auto;padding:0;margin:0;cursor:pointer;}
.msgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:.95rem;line-height:1.4;position:relative;word-wrap:break-word;animation:popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
@keyframes popIn { from{opacity:0; transform:scale(0.8) translateY(10px)} to{opacity:1; transform:scale(1) translateY(0)} }
.msg.in{align-self:flex-start;background:var(--msg-in);border-bottom-left-radius:4px;}
.msg.out{align-self:flex-end;background:var(--msg-out);color:#fff;border-bottom-right-radius:4px;box-shadow:0 3px 10px rgba(124,58,237,0.3);}
.msg .t{font-size:.65rem;opacity:.6;margin-top:4px;display:block;text-align:right}
.msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
.msg audio { width: 100%; margin-top: 5px; }
.reply-block { font-size: 0.75rem; border-left: 2px solid rgba(255,255,255,0.5); padding-left: 5px; margin-bottom: 5px; opacity: 0.7; }
.voice-msg { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 20px; cursor: pointer; margin-top: 5px; color: #fff; user-select: none; width: fit-content;}
.voice-msg .play-icon { font-size: 1.2rem; }
.waveform { display: flex; align-items: center; gap: 3px; height: 20px; }
.waveform span { width: 3px; background: rgba(255,255,255,0.6); border-radius: 2px; }
.waveform span:nth-child(1) { height: 40%; }
.waveform span:nth-child(2) { height: 70%; }
.waveform span:nth-child(3) { height: 100%; }
.waveform span:nth-child(4) { height: 60%; }
.waveform span:nth-child(5) { height: 80%; }
.waveform span:nth-child(6) { height: 50%; }
.waveform span:nth-child(7) { height: 90%; }
.duration { font-size: 0.8rem; opacity: 0.7; }
.input-bar{padding:10px;background:var(--panel);backdrop-filter:blur(15px);display:flex;gap:8px;border-top:1px solid var(--border); align-items:center;}
.input-bar input{margin:0; flex:1;}
.input-bar button{width:45px; margin:0; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0;}
.profile-header{text-align:center;padding:20px;background:var(--panel);backdrop-filter:blur(15px);border-radius:16px;margin-bottom:15px;border:1px solid var(--border);}
.profile-av{width:90px;height:90px;border-radius:50%;margin:0 auto 15px;background:var(--msg-out);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:bold;overflow:hidden;color:#fff;position:relative;border:3px solid var(--panel);box-shadow:0 0 15px rgba(0,0,0,0.5);}
.profile-av img{width:100%;height:100%;object-fit:cover;}
.profile-av.verified { box-shadow: 0 0 20px #3b82f6; border-color: #3b82f6; }
.settings-item{display:flex;justify-content:space-between;align-items:center;padding:15px;background:var(--panel);backdrop-filter:blur(15px);border-radius:12px;margin-bottom:10px;border:1px solid var(--border);cursor:pointer;}
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal-box { background: var(--panel); backdrop-filter: blur(15px); padding: 20px; border-radius: 20px; width: 100%; max-width: 350px; border: 1px solid var(--border); }
.typing-dots { display: none; align-items: center; gap: 3px; margin-left: 5px; }
.typing-dots span { width: 5px; height: 5px; background: var(--muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
.typing-dots span:nth-child(1) { animation-delay: -0.32s; }
.typing-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
.reply-preview { display: none; padding: 10px; background: var(--panel); border-left: 3px solid var(--accent); margin: 0 10px; border-radius: 10px 10px 0 0; align-items: center; justify-content: space-between; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="screen active" id="screenAuth">
    <div class="auth-box">
        <div class="logo">Mershessenger</div>
        <div id="loginForm">
            <input type="text" id="loginUsername" placeholder="@username">
            <input type="password" id="loginPass" placeholder="Пароль">
            <button class="btn-main" onclick="doLogin()">Войти</button>
            <button class="btn-sec" onclick="toggleAuth('reg')">Регистрация</button>
        </div>
        <div id="registerForm" class="hidden">
            <input type="text" id="regName" placeholder="Имя">
            <input type="text" id="regUsername" placeholder="username">
            <input type="password" id="regPass" placeholder="Пароль">
            <button class="btn-main" onclick="doRegister()">Создать аккаунт</button>
            <button class="btn-sec" onclick="toggleAuth('login')">Уже есть аккаунт?</button>
        </div>
    </div>
</div>

<div class="screen" id="screenMain">
    <div class="top-bar">Mershessenger</div>
    <div class="content" id="contentArea"></div>
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('chats')"><span class="nav-icon">💬</span>Чаты</button>
        <button class="nav-item" onclick="window.location.href='channels.html'"><span class="nav-icon">👥</span>Группы</button>
        <button class="nav-item" onclick="switchTab('profile')"><span class="nav-icon">👤</span>Профиль</button>
    </div>
</div>

<div class="chat-view" id="chatView">
    <div class="chat-head">
        <button class="back-btn" onclick="closeChat()">←</button>
        <div class="chat-av" id="chatHeadAv" style="width:36px;height:36px;font-size:1rem"></div>
        <div style="font-weight:600;flex:1" id="chatHeadName">—</div>
        <div class="typing-dots" id="typingDots"><span></span><span></span><span></span></div>
    </div>
    <div class="msgs" id="msgsArea"></div>
    
    <div class="reply-preview" id="replyPreview">
        <span id="replyText" style="font-size:0.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:80%;"></span>
        <span onclick="cancelReply()" style="cursor:pointer; color:red; font-weight:bold; padding:0 10px;">✖</span>
    </div>

    <div class="input-bar">
        <button class="btn-sec" style="background:transparent; border:none; color:var(--text);" onclick="document.getElementById('imgFile').click()">📷</button>
        <input type="file" id="imgFile" accept="image/*" style="display:none" onchange="sendImg(event)">
        <button class="btn-sec" style="background:transparent; border:none; color:var(--text);" onclick="toggleVoice()" id="micBtn">🎤</button>
        <input type="text" id="msgInput" placeholder="Сообщение..." oninput="handleTyping()">
        <button class="btn-main" onclick="sendMsg()">➤</button>
    </div>
</div>

<div class="modal" id="editModal">
    <div class="modal-box">
        <h3 style="margin-bottom:15px;text-align:center">Профиль</h3>
        <button class="btn-sec" onclick="document.getElementById('avFile').click()">Загрузить аватар</button>
        <input type="file" id="avFile" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
        <input type="text" id="editName" placeholder="Имя" style="margin-top:10px;">
        <input type="text" id="editUsername" placeholder="Новый юзернейм (без @)">
        <input type="text" id="editBio" placeholder="Статус (О себе)">
        <button class="btn-main" onclick="saveProfile()">Сохранить</button>
        <button class="btn-sec" onclick="document.getElementById('editModal').style.display='none'">Отмена</button>
    </div>
</div>

<div class="modal" id="adminModal">
    <div class="modal-box">
        <h3 style="margin-bottom:15px;text-align:center;color:#eab308">👑 Админ-панель</h3>
        <p style="font-size:0.8rem; color:var(--muted); margin-bottom:10px;">Введи юзернейм:</p>
        <input type="text" id="adminTarget" placeholder="@username">
        <button class="btn-main" onclick="grantAdmin()">Выдать Админку</button>
        <button class="btn-main" onclick="grantVerify()" style="background:#3b82f6">Выдать Галочку</button>
        <button class="btn-sec" onclick="document.getElementById('adminModal').style.display='none'">Закрыть</button>
    </div>
</div>

<script>
const SUPABASE_URL = "https://elmntceguuiewmxfcnvv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsbW50Y2VndXVpZXdteGZjbnZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2OTIxMzIsImV4cCI6MjEwOTI2ODEzMn0.x0bx-pO6kET6-PwbdNoLgPI_ULSFSC_CRXsWW_dIW6c";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let myUser = null;
let currentChat = null;
let currentTab = 'chats';
let typingTimeout = null;
let replyToMsg = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let currentAudio = null;

const $ = id => document.getElementById(id);
const saved = localStorage.getItem('mersh_user');
if (saved) { myUser = JSON.parse(saved); startApp(); }

function toggleAuth(type) {
    $('loginForm').classList.toggle('hidden', type === 'reg');
    $('registerForm').classList.toggle('hidden', type === 'login');
}

async function doRegister() {
    const name = $('regName').value.trim();
    const username = $('regUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
    const pass = $('regPass').value.trim();
    if (!name || username.length < 4 || pass.length < 6) return alert('Проверь данные');

    const { data: exist } = await db.from('profiles').select('username').eq('username', username).single();
    if (exist) return alert('Юзернейм занят');

    const { data, error } = await db.from('profiles').insert([{ username, name, password: pass }]).select().single();
    if (error) return alert(error.message);

    myUser = data; localStorage.setItem('mersh_user', JSON.stringify(myUser)); startApp();
}

async function doLogin() {
    const username = $('loginUsername').value.trim().toLowerCase().replace('@', '');
    const pass = $('loginPass').value.trim();
    const { data, error } = await db.from('profiles').select('*').eq('username', username).single();
    if (error || !data) return alert('Аккаунт не найден');
    if (data.password !== pass) return alert('Неверный пароль');
    myUser = data; localStorage.setItem('mersh_user', JSON.stringify(myUser)); startApp();
}

function startApp() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $('screenMain').classList.add('active');
    if (myUser.theme === 'light') document.body.classList.add('light-theme');
    switchTab('chats');
    listenRealtime();
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-item').forEach((b, i) => b.classList.toggle('active', ['chats','groups','profile'][i] === tab));
    renderContent();
}

function renderContent() {
    const c = $('contentArea');
    if (currentTab === 'chats') renderChats(c);
    if (currentTab === 'profile') renderProfile(c);
}

async function renderChats(c) {
    c.innerHTML = 'Загрузка...';
    const { data: msgs } = await db.from('messages').select('*').or(`sender.eq.${myUser.username},receiver.eq.${myUser.username}`).order('created_at', { ascending: false });
    const users = new Set();
    msgs?.forEach(m => { if (m.sender !== myUser.username) users.add(m.sender); if (m.receiver !== myUser.username) users.add(m.receiver); });
    if (users.size === 0) return c.innerHTML = '<p style="text-align:center;color:var(--muted)">Нет чатов. Ищи друзей!</p>';

    let html = '';
    for (let u of users) {
        const { data: p } = await db.from('profiles').select('*').eq('username', u).single();
        if (p) {
            const lastMsg = msgs.find(m => m.sender === u || m.receiver === u);
            const av = p.avatar ? `<img src="${p.avatar}">` : p.name[0];
            const badge = p.is_verified ? '<span class="badge-verified">✓</span>' : '';
            let lastText = '';
            if (lastMsg) {
                if (lastMsg.image_url) lastText = '📷 Фото';
                else if (lastMsg.voice_url) lastText = '🎤 Голосовое';
                else lastText = lastMsg.content;
            }
            html += `<div class="chat-card" onclick="openChat('${p.username}', '${p.name}')"><div class="chat-av ${p.is_verified?'verified':''}">${av}</div><div class="chat-info"><div class="chat-name">${p.name} ${badge}</div><div class="chat-last">${lastText}</div></div></div>`;
        }
    }
    c.innerHTML = html;
}

function renderProfile(c) {
    const av = myUser.avatar ? `<img src="${myUser.avatar}">` : myUser.name[0];
    const badge = myUser.is_verified ? '<span class="badge-verified" style="font-size:1.5rem; margin-left:10px;">✓</span>' : '';
    const admin = myUser.is_admin ? '<span class="badge-admin" style="font-size:1.5rem; margin-left:5px;">👑</span>' : '';
    const bio = myUser.bio ? `<p style="margin:10px 0; font-style:italic; color:var(--muted);">"${myUser.bio}"</p>` : '';
    
    let adminBtn = myUser.is_admin ? `<div class="settings-item" onclick="document.getElementById('adminModal').style.display='flex'" style="border-color:#eab308; color:#eab308;"><span>👑 Админ-панель</span></div>` : '';

    c.innerHTML = `<div class="profile-header"><div class="profile-av ${myUser.is_verified?'verified':''}">${av}</div><h2>${myUser.name} ${badge} ${admin}</h2><p style="color:var(--muted); margin-bottom:5px;">@${myUser.username}</p>${bio}<button class="btn-sec" onclick="openEdit()" style="margin-top:15px;">Редактировать</button></div>${adminBtn}<div class="settings-item" onclick="toggleTheme()"><span>🌓 Тема</span><span>${myUser.theme === 'light' ? 'Светлая' : 'Тёмная'}</span></div><div class="settings-item" onclick="logout()"><span style="color:red">🚪 Выйти</span></div>`;
}

function openEdit() { 
    $('editName').value = myUser.name; 
    $('editUsername').value = myUser.username;
    $('editBio').value = myUser.bio || ''; 
    $('editModal').style.display = 'flex'; 
}

async function uploadAvatar(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        const img = new Image();
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const max = 300, ratio = Math.min(max / img.width, max / img.height, 1);
            canvas.width = img.width * ratio; canvas.height = img.height * ratio;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            myUser.avatar = canvas.toDataURL('image/jpeg', 0.7);
            await db.from('profiles').update({ avatar: myUser.avatar }).eq('username', myUser.username);
            localStorage.setItem('mersh_user', JSON.stringify(myUser));
            alert('Аватар обновлен (нажмите Сохранить в профиле)');
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
}

async function saveProfile() {
    const newName = $('editName').value.trim() || myUser.name;
    const newBio = $('editBio').value.trim();
    const newUsername = $('editUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
    
    let updateData = { name: newName, bio: newBio };
    
    if (newUsername && newUsername !== myUser.username) {
        const { data: exist } = await db.from('profiles').select('username').eq('username', newUsername).single();
        if (exist) return alert('Этот юзернейм уже занят');
        updateData.username = newUsername;
    }
    
    await db.from('profiles').update(updateData).eq('username', myUser.username);
    
    myUser.name = newName;
    myUser.bio = newBio;
    if (newUsername) myUser.username = newUsername;
    
    localStorage.setItem('mersh_user', JSON.stringify(myUser));
    $('editModal').style.display = 'none';
    renderContent();
}

async function grantAdmin() {
    const target = $('adminTarget').value.trim().toLowerCase().replace('@', '');
    if (!target) return;
    await db.from('profiles').update({ is_admin: true }).eq('username', target);
    alert('Пользователь ' + target + ' теперь админ!');
}

async function grantVerify() {
    const target = $('adminTarget').value.trim().toLowerCase().replace('@', '');
    if (!target) return;
    await db.from('profiles').update({ is_verified: true }).eq('username', target);
    alert('Пользователь ' + target + ' получил галочку!');
}

async function toggleTheme() {
    myUser.theme = myUser.theme === 'light' ? 'dark' : 'light';
    await db.from('profiles').update({ theme: myUser.theme }).eq('username', myUser.username);
    localStorage.setItem('mersh_user', JSON.stringify(myUser));
    document.body.classList.toggle('light-theme', myUser.theme === 'light');
    renderContent();
}

function logout() { localStorage.removeItem('mersh_user'); location.reload(); }

async function openChat(username, name) {
    currentChat = username;
    $('chatHeadName').textContent = name;
    const { data: p } = await db.from('profiles').select('*').eq('username', username).single();
    $('chatHeadAv').innerHTML = p?.avatar ? `<img src="${p.avatar}">` : name[0];
    $('chatView').classList.add('active');
    loadMessages();
    checkTyping();
}

function closeChat() { $('chatView').classList.remove('active'); currentChat = null; renderContent(); }

async function loadMessages() {
    const { data: msgs } = await db.from('messages').select('*').or(`and(sender.eq.${myUser.username},receiver.eq.${currentChat}),and(sender.eq.${currentChat},receiver.eq.${myUser.username})`).order('created_at', { ascending: true });
    const area = $('msgsArea');
    
    area.innerHTML = msgs?.map(m => {
        let content = m.content;
        if (m.image_url) content = `<img src="${m.image_url}">`;
        else if (m.voice_url) {
            content = `<div class="voice-msg" onclick="playVoice(this, '${m.voice_url}')">
                <div class="play-icon">▶</div>
                <div class="waveform"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
                <div class="duration">0:00</div>
            </div>`;
        }
        
        let replyHtml = '';
        if (m.reply_to) {
            const replied = msgs.find(x => x.id == m.reply_to);
            if (replied) {
                const author = replied.sender === myUser.username ? 'Вы' : replied.sender;
                const txt = replied.content ? replied.content.substring(0, 25) : 'Медиа';
                replyHtml = `<div class="reply-block"><b>${author}:</b> ${txt}...</div>`;
            }
        }

        return `<div class="msg ${m.sender === myUser.username ? 'out' : 'in'}" ondblclick="setReply(${m.id}, '${m.content ? m.content.replace(/'/g, "\\'") : 'Медиа'}', '${m.sender === myUser.username ? 'Вы' : m.sender}')">
            ${replyHtml}${content}
            <span class="t">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
        </div>`;
    }).join('') || '';
    area.scrollTop = area.scrollHeight;
}

function setReply(msgId, text, senderName) {
    replyToMsg = { id: msgId };
    $('replyPreview').style.display = 'flex';
    $('replyText').innerHTML = `<b>${senderName}:</b> ${text.substring(0, 30)}`;
}

function cancelReply() {
    replyToMsg = null;
    $('replyPreview').style.display = 'none';
}

async function sendImg(e) {
    const file = e.target.files[0]; 
    if (!file || !currentChat) return alert("Файл не выбран или чат не открыт");

    const reader = new FileReader();
    reader.onload = async (ev) => {
        const img = new Image();
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const max = 600; 
            const ratio = Math.min(max / img.width, max / img.height, 1);
            canvas.width = img.width * ratio; 
            canvas.height = img.height * ratio;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const base64 = canvas.toDataURL('image/jpeg', 0.5); 

            const { error } = await db.from('messages').insert([{ 
                sender: myUser.username, 
                receiver: currentChat, 
                content: '', 
                image_url: base64,
                reply_to: replyToMsg ? replyToMsg.id : null
            }]);

            if (error) alert('Ошибка: ' + error.message);
            else { cancelReply(); loadMessages(); }
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
}

async function sendMsg() {
    const text = $('msgInput').value.trim();
    if (!text || !currentChat) return;
    $('msgInput').value = '';
    await db.from('messages').insert([{ 
        sender: myUser.username, 
        receiver: currentChat, 
        content: text,
        reply_to: replyToMsg ? replyToMsg.id : null
    }]);
    cancelReply();
    await db.from('profiles').update({ is_typing: false }).eq('username', myUser.username);
    loadMessages();
}

async function handleTyping() {
    if (!currentChat) return;
    await db.from('profiles').update({ is_typing: true }).eq('username', myUser.username);
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(async () => { await db.from('profiles').update({ is_typing: false }).eq('username', myUser.username); }, 2000);
}

async function checkTyping() {
    setInterval(async () => {
        if (!currentChat) return;
        const { data } = await db.from('profiles').select('is_typing').eq('username', currentChat).single();
        if (data && data.is_typing) $('typingDots').style.display = 'flex';
        else $('typingDots').style.display = 'none';
    }, 1500);
}

async function toggleVoice() {
    if (!isRecording) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onloadend = async () => {
                    await db.from('messages').insert([{ 
                        sender: myUser.username, receiver: currentChat, content: '', voice_url: reader.result,
                        reply_to: replyToMsg ? replyToMsg.id : null
                    }]);
                    cancelReply();
                    loadMessages();
                };
                reader.readAsDataURL(blob);
                stream.getTracks().forEach(t => t.stop());
            };
            mediaRecorder.start();
            isRecording = true;
            $('micBtn').style.color = 'red';
        } catch (e) { alert('Разреши доступ к микрофону!'); }
    } else {
        mediaRecorder.stop();
        isRecording = false;
        $('micBtn').style.color = 'var(--text)';
    }
}

function playVoice(element, url) {
    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
        document.querySelectorAll('.voice-msg').forEach(el => el.classList.remove('playing'));
        if (element.classList.contains('playing')) return;
    }

    currentAudio = new Audio(url);
    currentAudio.play();
    element.classList.add('playing');
    element.querySelector('.play-icon').innerText = '⏸';

    currentAudio.onended = () => {
        element.classList.remove('playing');
        element.querySelector('.play-icon').innerText = '▶';
        currentAudio = null;
    };
}

function listenRealtime() {
    db.channel('messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
        const m = p.new;
        if (currentChat && (m.sender === currentChat || m.receiver === currentChat)) loadMessages();
    }).subscribe();
}
</script>
